[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jit-access-broker"
version = "1.3.0"
description = "A small, auditable Just-In-Time privileged access broker (educational lab project)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vitor Fabelo" }]
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
jit-broker = "jit_broker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jit_broker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jit_broker --cov-report=term-missing"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
