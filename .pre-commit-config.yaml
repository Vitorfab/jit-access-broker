repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0 # placeholder: pinned by `uv run pre-commit autoupdate`
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]